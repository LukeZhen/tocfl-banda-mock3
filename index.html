<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thi thử TOCFL Band A</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Phòng thi máy tính: thanh trên (phần thi, số câu, đồng hồ), một câu một màn hình, bảng số câu ở phần đọc. */
:root {
  --paper: #eef1f4; --card: #ffffff; --well: #f5f7f9; --ink: #1d2733; --muted: #5d6b7a; --line: #d3dae2;
  --accent: #b2342a; --accent-ink: #ffffff; --accent-soft: #f7e1de; --sel: #1f5f99; --sel-soft: #dce9f6;
  --good: #1f7a4d; --good-soft: #dcefe4; --bad: #b2342a; --bad-soft: #f7e1de; --warn: #9a5b0c; --warn-soft: #f6e7cf;
  --ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; --zh: "Noto Serif TC", "PMingLiU", "Microsoft JhengHei", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12171c; --card: #1b222a; --well: #222b34; --ink: #e6ecf2; --muted: #9fb0c0; --line: #33404c;
  --accent: #ef7d71; --accent-ink: #2a0d09; --accent-soft: #42221f; --sel: #7fb4e6; --sel-soft: #1e3347;
  --good: #6fd3a0; --good-soft: #193628; --bad: #ef7d71; --bad-soft: #42221f; --warn: #e9b067; --warn-soft: #3a2b16; color-scheme: dark;
} }
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 16px/1.55 var(--ui); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: flex; flex-direction: column; gap: 16px; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1000px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar .sec { font-weight: 700; } .bar .zh { font-family: var(--zh); margin-right: 6px; }
.bar .num { color: var(--muted); font-size: 14px; }
.clock { margin-left: auto; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.clock.warn { color: var(--warn); }
.track { height: 4px; background: var(--line); } .track i { display: block; height: 100%; background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h1 { font-family: var(--zh); font-size: 32px; line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 13px; font-weight: 600; } td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tscroll { overflow-x: auto; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 220px; min-width: 0; }
.field label { font-size: 14px; font-weight: 600; }
.field input { font: inherit; color: inherit; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.btn { border: 1px solid var(--line); background: var(--well); padding: 10px 16px; border-radius: 8px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--sel-soft); border-color: var(--sel); }
.err { color: var(--bad); font-size: 14px; font-weight: 500; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qno { font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
/* Hình cắt từ đề gốc: luôn nằm trên nền giấy trắng */
.paper { background: #fff; border-radius: 8px; padding: 10px; border: 1px solid var(--line); }
.paper img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.paper.solo img { max-height: 46vh; }
.paper.opts img { max-width: min(100%, 520px); margin: 0; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; }
.ans { border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 14px 0; font-size: 22px; font-weight: 700; }
.ans[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-soft); color: var(--sel); }
.ans:disabled { cursor: default; }
.blank { font-weight: 700; color: var(--accent); }
.note { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; animation: p 1.2s ease-in-out infinite; }
@keyframes p { 50% { opacity: .3; } } @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.pb { height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 14px; position: relative; padding: 0; font-variant-numeric: tabular-nums; }
.pb.done { background: var(--sel-soft); border-color: var(--sel); }
.pb.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.pb.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; } .nav .sp { flex: 1; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.score { background: var(--well); border-radius: 10px; padding: 14px 16px; }
.score b { display: block; font-size: 36px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.pill.ok { background: var(--good-soft); color: var(--good); } .pill.no { background: var(--bad-soft); color: var(--bad); } .pill.skip { background: var(--warn-soft); color: var(--warn); }
.rv { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.rv .paper img { max-height: 260px; }
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 22, .6); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.overlay .card { max-width: 440px; width: 100%; }
.overlay .card.wide { max-width: 860px; }
@media (max-width: 520px) { h1 { font-size: 26px; } .card { padding: 14px; } .ans { font-size: 20px; padding: 12px 0; } }
@media print { .bar, .noprint { display: none !important; } }
</style>
</head>

}
function answersHtml(n, count, locked) {
  return `<div class="answers">` + L.slice(0, count).split("").map(c => `<button type="button" class="ans" data-l="${c}" aria-pressed="${S.ans[n] === c}" ${locked ? "disabled" : ""}>${c}</button>`).join("") + `</div>`;
}
function bindAnswers(n, after) {
  app.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    S.ans[n] = b.dataset.l; save();
    app.querySelectorAll(".ans").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (after) after();
  }));
}

/* ---------- mở đầu ---------- */
function showHome() {
  bar.hidden = true;
  app.innerHTML = `<div class="card">
    <span class="eyebrow">TOCFL · 華語文能力測驗 · 入門基礎級 Band A · 模擬試題</span>
    <h1>華語文能力測驗 模擬考</h1>
    <p>Bài thi thử gồm phần nghe và phần đọc, lấy nguyên đề thi thử chính thức. Phần nghe phát liên tục như phòng thi thật: không dừng, không nghe lại, câu hỏi tự chuyển. Phần đọc được quay lại sửa bài trước khi nộp.</p>
    <div class="tscroll"><table>
      <tr><th>Phần thi</th><th>Nội dung</th><th>Số câu</th><th>Thời gian</th></tr>
      <tr><td><b>聽力</b> Nghe</td><td>Phần 1: nhìn tranh, nghe câu hỏi và lựa chọn<br>Phần 2: đối thoại ngắn, chọn tranh<br>Phần 3: đối thoại 4 câu, chọn tranh<br>Phần 4: đối thoại, chọn 1 trong 4 câu</td><td class="n">10<br>15<br>15<br>10</td><td class="n">khoảng ${Math.round(TOTAL / 60)} phút</td></tr>
      <tr><td><b>閱讀</b> Đọc</td><td>Phần 1: đọc câu, chọn tranh<br>Phần 2: nhìn tranh, chọn câu<br>Phần 3: chọn từ điền chỗ trống<br>Phần 4: điền câu vào đoạn văn<br>Phần 5: đọc hiểu đoạn văn</td><td class="n">15<br>15<br>5<br>10<br>5</td><td class="n">${CONFIG.readSec / 60} phút</td></tr>
    </table></div>
  </div>
  <div class="card">
    <h2>Trước khi vào thi</h2>
    <div class="row"><div class="field"><label for="fName">Họ tên</label><input id="fName" autocomplete="name" value="${esc(S.name)}"></div><div class="field"><label for="fCls">Lớp</label><input id="fCls" value="${esc(S.cls)}"></div></div>
    <div class="row"><button type="button" class="btn" id="btnChk">Thử âm thanh</button><span class="muted" id="chkMsg">Đeo tai nghe, dùng mạng ổn định. Bấm thử để kiểm tra loa và âm lượng.</span></div>
    <p class="muted">Không khóa màn hình hay chuyển sang ứng dụng khác khi đang nghe. Đoạn bị lỡ sẽ không nghe lại được.</p>
    <p class="err" id="homeErr" hidden></p>
    <div class="row"><button type="button" class="btn primary" id="btnStart">Bắt đầu phần nghe</button></div>
  </div>`;
  $("btnChk").addEventListener("click", () => { chk.currentTime = 0; chk.play().then(() => { $("chkMsg").textContent = "Nếu nghe thấy âm thanh là đã sẵn sàng."; }).catch(() => { $("chkMsg").textContent = "Không phát được âm thanh. Hãy tải lại trang hoặc đổi trình duyệt."; }); });
  $("btnStart").addEventListener("click", () => {
    const name = $("fName").value.trim();
    if (!name) { const e = $("homeErr"); e.hidden = false; e.textContent = "Hãy nhập họ tên để kết quả ghi đúng tên bạn."; $("fName").focus(); return; }
    S.name = name; S.cls = $("fCls").value.trim(); S.phase = "listen"; S.listenStart = Date.now(); save();
    EXAM.listen.forEach(p => { new Image().src = p.intro; p.items.forEach(it => { new Image().src = it.img; }); });
    playFrom(0);
  });
}

/* ---------- phần nghe ---------- */
let idx = -1, ticker = null, expectPause = false;
function locate(t) { let i = 0; while (i + 1 < PLAY.length && PLAY[i + 1].t0 <= t) i++; return { i, off: t - PLAY[i].t0 }; }
const elapsed = () => (Date.now() - S.listenStart) / 1000;
function playFrom(t) {
  ov.hidden = true;
  if (t >= TOTAL - 1) { finishListening(); return; }
  const { i, off } = locate(t);
  loadTrack(i, off);
}
function loadTrack(i, off) {
  idx = i; const x = PLAY[i];
  renderListen();
  expectPause = true;
  aud.src = "audio/" + x.file;
  const go = () => { try { if (off > 0.5) aud.currentTime = off; } catch (e) {} aud.play().then(() => { expectPause = false; tick(); }).catch(() => resumeOverlay("Trình duyệt chưa cho phát âm thanh. Bấm để nghe."));};
  aud.addEventListener("loadedmetadata", go, { once: true });
  aud.load();
}
aud.addEventListener("ended", () => { if (S.phase !== "listen") return; if (idx + 1 < PLAY.length) loadTrack(idx + 1, 0); else finishListening(); });
aud.addEventListener("pause", () => { if (S.phase === "listen" && !aud.ended && !expectPause) resumeOverlay("Âm thanh bị dừng (có thể do khóa màn hình hoặc chuyển ứng dụng)."); });
aud.addEventListener("error", () => { if (S.phase === "listen") resumeOverlay("Không tải được file nghe. Kiểm tra mạng rồi bấm để nghe tiếp."); });
function tick() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    const t = PLAY[idx].t0 + (aud.currentTime || 0);
    const c = $("clk"), tr = $("trk");
    if (c) c.textContent = mmss(TOTAL - t);
    if (tr) tr.style.width = (t / TOTAL * 100) + "%";
  }, 500);
}
function resumeOverlay(msg) {
  ov.hidden = false;
  ov.innerHTML = `<div class="card"><h2>Âm thanh đang dừng</h2><p>${msg}</p><p class="muted">Đề tiếp tục theo thời gian thật nên đoạn đã trôi qua sẽ không nghe lại.</p><button type="button" class="btn primary" id="btnRes">Nghe tiếp</button></div>`;
  $("btnRes").addEventListener("click", () => playFrom(elapsed()));
}
function renderListen() {
  const x = PLAY[idx], t = x.t0;
  const qn = x.q || "";
  renderBar("聽力", "Nghe", qn ? `Câu ${qn}/50` : "", mmss(TOTAL - t), t / TOTAL * 100);
  if (x.end) { app.innerHTML = `<div class="card"><h2>聽力考試到這裡全部結束。</h2><div class="note"><span class="pulse"></span>Phần nghe kết thúc.</div></div>`; return; }
  if (x.part) {
    const p = EXAM.listen.find(pp => pp.part === x.part);
    app.innerHTML = `<div class="card"><span class="eyebrow">Phần ${p.part}</span><h1>${p.title}</h1><p>${p.vi}</p><div class="note"><span class="pulse"></span>Đang đọc hướng dẫn. Câu hỏi sẽ tự hiện.</div><div class="paper"><img src="${p.intro}" alt="Hướng dẫn ${p.title}"></div></div>`;
    return;
  }
  const { p, it } = find(x.q);
  app.innerHTML = `<div class="card">
    <div class="qhead"><span class="qno">${it.n}</span><span class="muted">Phần ${p.part} · ${p.vi}</span></div>
    <div class="paper ${p.part === 1 ? "solo" : p.part === 4 ? "opts" : ""}"><img src="${it.img}" alt="Câu ${it.n}"></div>
    ${answersHtml(it.n, p.n, false)}
    <div class="note"><span class="pulse"></span>Câu hỏi tự chuyển, không quay lại được.</div></div>`;
  bindAnswers(it.n);
}
function finishListening() { clearInterval(ticker); expectPause = true; aud.pause(); S.phase = "gap"; S.gapStart = Date.now(); save(); showGap(); }

/* ---------- nghỉ ---------- */
function showGap() {
  renderBar("休息", "Chuyển phần", "", mmss(CONFIG.gapSec), 100);
  app.innerHTML = `<div class="card"><h2>Đã xong phần nghe</h2><p>Phần đọc có 50 câu, làm trong ${CONFIG.readSec / 60} phút. Phần đọc tự bắt đầu khi hết giờ nghỉ.</p><div class="row"><button type="button" class="btn primary" id="btnRead">Bắt đầu phần đọc ngay</button></div></div>`;
  $("btnRead").addEventListener("click", startReading);
  clearInterval(ticker);
  ticker = setInterval(() => { const left = CONFIG.gapSec - (Date.now() - S.gapStart) / 1000; if (left <= 0) startReading(); else { const c = $("clk"); if (c) c.textContent = mmss(left); } }, 500);
}

/* ---------- phần đọc ---------- */
const readLeft = () => CONFIG.readSec - (Date.now() - S.readStart) / 1000;
function startReading() {
  clearInterval(ticker);
  S.phase = "read"; S.readStart = S.readStart || Date.now(); S.cur = S.cur || 51; save();
  showRead();
  ticker = setInterval(() => { const left = readLeft(); if (left <= 0) { submit(); return; } const c = $("clk"); if (c) { c.textContent = mmss(left); c.classList.toggle("warn", left <= 300); } }, 500);
}
function paint() { app.querySelectorAll(".pb").forEach(b => { const n = +b.dataset.n; b.classList.toggle("done", !!S.ans[n]); b.classList.toggle("flag", !!S.flags[n]); b.classList.toggle("cur", n === S.cur); }); }
function showRead() {
  const n = S.cur, { p, it } = find(n), left = readLeft(), first = p.items[0].n === n;
  renderBar("閱讀", "Đọc", `Câu ${n - 50}/50`, mmss(left), (n - 50) / 50 * 100, left <= 300);
  const nums = []; for (let i = 51; i <= 100; i++) nums.push(i);
  app.innerHTML = `<div class="card">
    <div class="qhead"><span class="qno">${n - 50}</span><span class="muted">Phần ${p.part} · ${p.vi}</span><span style="flex:1"></span><button type="button" class="btn" id="btnGuide">Xem hướng dẫn phần ${p.part}</button></div>
    ${it.shared ? `<div class="paper"><img src="${it.shared}" alt="Tranh hoặc đoạn văn chung"></div>` : ""}
    ${it.blank ? `<p>Chọn câu điền vào chỗ trống <span class="blank">${esc(it.blank)}</span>:</p>` : ""}
    <div class="paper ${p.part === 4 ? "opts" : ""}"><img src="${it.img}" alt="Câu ${n - 50}"></div>
    ${answersHtml(n, p.n, false)}
    <div class="nav">
      <button type="button" class="btn" id="prev" ${n === 51 ? "disabled" : ""}>← Câu trước</button>
      <button type="button" class="btn" id="flag" aria-pressed="${!!S.flags[n]}">${S.flags[n] ? "Bỏ đánh dấu" : "Đánh dấu xem lại"}</button>
      <span class="sp"></span>
      ${n < 100 ? `<button type="button" class="btn primary" id="next">Câu sau →</button>` : `<button type="button" class="btn primary" id="end">Xem lại và nộp bài</button>`}
    </div></div>
  <div class="card"><div class="palette">${nums.map(i => `<button type="button" class="pb" data-n="${i}" aria-label="Câu ${i - 50}">${i - 50}</button>`).join("")}</div>
    <div class="row"><span class="muted" id="cnt"></span><span style="flex:1"></span><button type="button" class="btn" id="sub">Nộp bài</button></div></div>`;
  const count = () => { $("cnt").textContent = `Đã làm ${nums.filter(i => S.ans[i]).length}/50 câu. Chấm cam là câu đang đánh dấu.`; };
  bindAnswers(n, () => { paint(); count(); });
  paint(); count();
  const go = m => { S.cur = m; save(); showRead(); window.scrollTo(0, 0); };
  $("prev").addEventListener("click", () => go(n - 1));
  if ($("next")) $("next").addEventListener("click", () => go(n + 1));
  if ($("end")) $("end").addEventListener("click", askSubmit);
  $("sub").addEventListener("click", askSubmit);
  $("flag").addEventListener("click", () => { S.flags[n] = !S.flags[n]; save(); showRead(); });
  $("btnGuide").addEventListener("click", () => { ov.hidden = false; ov.innerHTML = `<div class="card wide"><div class="paper"><img src="${p.intro}" alt="Hướng dẫn"></div><button type="button" class="btn primary" id="cg">Đóng</button></div>`; $("cg").addEventListener("click", () => { ov.hidden = true; }); });
  app.querySelectorAll(".pb").forEach(b => b.addEventListener("click", () => go(+b.dataset.n)));
  if (first && !S["seen" + p.part]) { S["seen" + p.part] = 1; save(); $("btnGuide").click(); }
}
function askSubmit() {
  const miss = []; for (let i = 51; i <= 100; i++) if (!S.ans[i]) miss.push(i - 50);
  ov.hidden = false;
  ov.innerHTML = `<div class="card"><h2>Nộp bài?</h2><p>${miss.length ? `Bạn còn ${miss.length} câu đọc chưa làm: ${miss.slice(0, 15).join(", ")}${miss.length > 15 ? "…" : ""}.` : "Bạn đã làm đủ 50 câu đọc."} Nộp rồi thì không sửa được nữa.</p><div class="row"><button type="button" class="btn primary" id="ok">Nộp bài</button><button type="button" class="btn" id="no">Làm tiếp</button></div></div>`;
  $("no").addEventListener("click", () => { ov.hidden = true; });
  $("ok").addEventListener("click", () => { ov.hidden = true; submit(); });
}
function submit() { clearInterval(ticker); S.phase = "result"; S.doneAt = S.doneAt || Date.now(); save(); showResult(); }

/* ---------- chấm điểm ---------- */
function decodeKey() {
  const raw = atob(KEY_BLOB), k = "bandA-mock3", b = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) b[i] = raw.charCodeAt(i) ^ k.charCodeAt(i % k.length);
  return JSON.parse(new TextDecoder().decode(b));
}
function grade(K) {
  const r = { L: 0, R: 0, parts: [], wrong: [] };
  [[EXAM.listen, "L", "Nghe"], [EXAM.read, "R", "Đọc"]].forEach(([sec, id, vi]) => sec.forEach(p => {
    let ok = 0; p.items.forEach(it => { if (S.ans[it.n] === K[it.n]) ok++; else r.wrong.push((id === "L" ? "N" : "Đ") + shown(it.n)); });
    r[id] += ok; r.parts.push({ vi, part: p.part, zh: p.title, ok, total: p.items.length });
  }));
  return r;
}
function review(K, onlyWrong) {
  let o = "";
  [[EXAM.listen, "聽力 Nghe"], [EXAM.read, "閱讀 Đọc"]].forEach(([sec, title]) => sec.forEach(p => p.items.forEach(it => {
    const mine = S.ans[it.n], ok = mine === K[it.n];
    if (onlyWrong && ok) return;
    const pill = ok ? `<span class="pill ok">Đúng</span>` : mine ? `<span class="pill no">Sai</span>` : `<span class="pill skip">Bỏ trống</span>`;
    o += `<div class="rv"><div class="row"><b>${shown(it.n)}</b><span class="muted">${title} · Phần ${p.part}</span>${pill}<span class="muted">Bạn chọn: <b>${mine || "–"}</b> · Đáp án: <b>${K[it.n]}</b></span></div>
      ${it.shared ? `<div class="paper"><img loading="lazy" src="${it.shared}" alt=""></div>` : ""}${it.blank ? `<p>Chỗ trống <span class="blank">${esc(it.blank)}</span></p>` : ""}
      <div class="paper"><img loading="lazy" src="${it.img}" alt="Câu ${shown(it.n)}"></div></div>`;
  })));
  return o || "<p>Bạn không sai câu nào.</p>";
}
function showResult() {
  const K = decodeKey(), r = grade(K), when = new Date(S.doneAt || Date.now()).toLocaleString("vi-VN");
  renderBar("成績", "Kết quả", "", "", 100);
  const summary = `${S.name}${S.cls ? " – lớp " + S.cls : ""} – Thi thử TOCFL Band A (mock 3)\nNghe: ${r.L}/50 câu đúng – Đọc: ${r.R}/50 câu đúng\nSai hoặc bỏ trống: ${r.wrong.join(", ") || "không có"}\nNộp lúc: ${when}`;
  const canPrint = window.self === window.top;
  app.innerHTML = `<div class="card">
    <span class="eyebrow">${esc(S.name)}${S.cls ? " · Lớp " + esc(S.cls) : ""} · ${when}</span>
    <h1>Kết quả thi thử</h1>
    <div class="scores">
      <div class="score">聽力 Nghe<b>${r.L}/50</b><span class="muted">${Math.round(r.L * 2)}% câu đúng</span></div>
      <div class="score">閱讀 Đọc<b>${r.R}/50</b><span class="muted">${Math.round(r.R * 2)}% câu đúng</span></div>
    </div>
    <p class="muted">Đây là số câu đúng. Điểm TOCFL chính thức được quy đổi theo thang riêng của kỳ thi, nên kết quả này chỉ dùng để tham khảo.</p>
    <div class="tscroll"><table><tr><th>Phần</th><th>Đúng</th></tr>${r.parts.map(p => `<tr><td>${p.vi} · Phần ${p.part} ${p.zh}</td><td class="n">${p.ok}/${p.total}</td></tr>`).join("")}</table></div>
    <div class="row noprint"><button type="button" class="btn primary" id="cp">Sao chép kết quả gửi cô</button>${canPrint ? `<button type="button" class="btn" id="pr">In hoặc lưu PDF</button>` : ""}<button type="button" class="btn" id="again">Làm lại từ đầu</button></div>
    <p class="muted" id="cpm" hidden></p></div>
  <div class="card"><div class="row noprint"><h2 style="flex:1">Xem lại bài</h2><button type="button" class="btn" id="tw" aria-pressed="true">Câu sai</button><button type="button" class="btn" id="ta" aria-pressed="false">Tất cả</button></div><div id="rvb" style="display:flex;flex-direction:column;gap:12px">${review(K, true)}</div></div>`;
  const setR = w => { $("rvb").innerHTML = review(K, w); $("tw").setAttribute("aria-pressed", w); $("ta").setAttribute("aria-pressed", !w); };
  $("tw").addEventListener("click", () => setR(true)); $("ta").addEventListener("click", () => setR(false));
  if ($("pr")) $("pr").addEventListener("click", () => window.print());
  $("cp").addEventListener("click", () => { const m = $("cpm"); m.hidden = false; navigator.clipboard.writeText(summary).then(() => { m.textContent = "Đã sao chép. Dán vào tin nhắn gửi cho cô."; }).catch(() => { m.textContent = summary; }); });
  $("again").addEventListener("click", () => {
    ov.hidden = false;
    ov.innerHTML = `<div class="card"><h2>Làm lại từ đầu?</h2><p>Kết quả hiện tại sẽ bị xóa. Hãy sao chép kết quả trước nếu cần gửi cô.</p><div class="row"><button type="button" class="btn primary" id="y">Xóa và làm lại</button><button type="button" class="btn" id="n">Giữ kết quả</button></div></div>`;
    $("n").addEventListener("click", () => { ov.hidden = true; });
    $("y").addEventListener("click", () => { ov.hidden = true; const nm = S.name, c = S.cls; S = fresh(); S.name = nm; S.cls = c; save(); showHome(); });
  });
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || !ov.hidden) return;
  const b = app.querySelector(`.ans[data-l="${e.key.toUpperCase()}"]`); if (b && !b.disabled) b.click();
});

function boot() {
  if (S.phase === "listen") {
    if (elapsed() >= TOTAL - 1) { finishListening(); return; }
    idx = locate(elapsed()).i; renderListen();
    resumeOverlay("Trang vừa được tải lại.");
  } else if (S.phase === "gap") { if ((Date.now() - S.gapStart) / 1000 >= CONFIG.gapSec) startReading(); else showGap(); }
  else if (S.phase === "read") { if (readLeft() <= 0) submit(); else startReading(); }
  else if (S.phase === "result") showResult();
  else showHome();
}
boot();
</script>
</body>
</html>
